# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit 리뷰 설정. 팀 규칙(AGENTS.md)을 리뷰어가 알고 있도록 옮겨 둔 파일입니다.
# 옵션 문서: https://docs.coderabbit.ai/reference/configuration
#
# 이 저장소 스택: React Native 0.85 CLI · React 19 · TypeScript(strict)
#   · React Navigation v7(native-stack) · axios · React Context · Jest
# src/ 없는 최상위 평면 구조: screens/ components/ api/ utils/ hooks/
#   contexts/ navigation/ constants/ styles/ assets/ __tests__/ __mocks__/

language: ko-KR

tone_instructions: >-
  한국어 존댓말로 리뷰합니다. 무엇이 잘못됐는지만 말하지 말고 왜 문제인지와 고친 예시를 함께 적어주세요.
  취향 차이나 사소한 제안은 nitpick 으로 표시해 병합을 막지 않습니다.

reviews:
  # chill — 확실한 문제만 지적하고 잔소리를 줄입니다.
  profile: chill
  # 리뷰가 남았다고 PR 을 막지 않습니다. 승인은 사람이 합니다.
  request_changes_workflow: false

  high_level_summary: true
  changed_files_summary: true
  # 결제·채팅 등 흐름이 있는 변경은 시퀀스 다이어그램이 도움이 됩니다.
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  collapse_walkthrough: true
  poem: false

  # GitHub 라벨은 아직 저장소에 정의돼 있지 않으므로 제안만 하고 자동 적용은 하지 않습니다.
  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:
    - label: feat
      instructions: 새 화면·컴포넌트·훅·API 등 사용자가 쓸 수 있는 기능이 추가될 때.
    - label: fix
      instructions: 기존에 동작하던 기능이 깨진 것을 고치는 변경.
    - label: refactor
      instructions: 동작은 그대로 두고 구조·이름·파일 위치만 바꾸는 변경.
    - label: test
      instructions: 테스트 추가·수정·인프라 정비만 있는 변경.
    - label: style
      instructions: >-
        StyleSheet·색상/타이포 토큰·레이아웃 등 화면에 보이는 모양만 바뀔 때.
        prettier 포매팅만 바뀐 경우에는 붙이지 않습니다.
    - label: docs
      instructions: README, AGENTS.md, docs/, PR·이슈 템플릿 등 문서만 바뀔 때.
    - label: chore
      instructions: 빌드 설정·의존성·CI·네이티브 설정 등 위 어디에도 안 맞는 잡무.

  suggested_reviewers: true
  auto_assign_reviewers: false

  auto_review:
    enabled: true
    # PR 기본 base 는 develop 입니다. main 은 기본 브랜치라 따로 적지 않아도 리뷰됩니다.
    base_branches:
      - develop
    # 새 커밋을 push 하면 바뀐 부분만 다시 리뷰합니다.
    auto_incremental_review: true
    # 작업 중인 draft PR 은 리뷰하지 않습니다.
    drafts: false
    ignore_title_keywords:
      - wip
      - '[wip]'
      - do not review

  # 리뷰에서 제외할 경로. 생성물·잠금 파일·바이너리·네이티브 빌드 산출물은 볼 필요가 없습니다.
  # 손으로 관리하는 네이티브 설정(AndroidManifest, build.gradle, Info.plist, AppDelegate 등)은
  # 리뷰 대상으로 남겨 둡니다.
  path_filters:
    - '!node_modules/**'
    - '!package-lock.json'
    - '!patches/**'
    - '!coverage/**'
    - '!assets/**'
    - '!docs/**'
    - '!android/app/build/**'
    - '!android/.gradle/**'
    - '!android/**/.cxx/**'
    - '!android/**/*.jar'
    - '!ios/Pods/**'
    - '!ios/build/**'
    - '!**/*.pbxproj'
    - '!**/Podfile.lock'

  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: >-
        AGENTS.md 의 코드 컨벤션을 기준으로 봅니다.

        - import 은 상대경로(`../`)를 씁니다. 이 저장소에는 path alias 가 없습니다.
          순서는 외부 패키지 → 내부 모듈이고 그 사이에 빈 줄을 둡니다.
        - `any` 는 지양합니다. 불가피하면 한 줄 이유 주석을 답니다.
          `@ts-ignore`, `@ts-expect-error`, `eslint-disable` 로 strict 를 우회하는 코드는 지적해주세요.
        - 파일명: 화면·컴포넌트는 PascalCase(`LoginScreen.tsx`), 그 외 모듈은 camelCase(`apiClient.ts`).
          컴포넌트·타입은 PascalCase, 함수·변수는 camelCase, 상수는 UPPER_SNAKE_CASE, 훅은 `use` 로 시작합니다.
        - 화면·모듈 상단에는 역할을 설명하는 한국어 블록 주석을 답니다(기존 파일 참고).
        - 식별자는 영어로, UI 문자열과 주석은 한국어로 씁니다.
        - 토큰 등 민감 정보는 `utils/secureStorage.ts`(Keychain 래퍼)로만 다룹니다.
          `AsyncStorage` 에 토큰을 저장하면 지적해주세요.
        - 환경값은 `react-native-config` 의 `Config.*` 로 읽습니다.
          하드코딩된 API URL·클라이언트 키·시크릿은 지적해주세요.

    - path: 'screens/**/*.tsx'
      instructions: >-
        - 화면은 `XxxScreen.tsx` + `XxxScreen.styles.ts` 쌍으로 둡니다. 인라인 정적 스타일은 지양합니다.
        - 새 화면은 `navigation/RootNavigator.tsx` 의 `RootStackParamList` 에 라우트명·파라미터 타입을 추가하고
          `<Stack.Screen>` 으로 등록했는지 확인해주세요.
        - 데이터를 기다리는 화면에는 로딩·에러·성공 세 상태가 모두 있어야 하고, 에러 시 재시도 수단이 필요합니다.
        - 네트워크 호출은 화면에서 axios 를 직접 부르지 않고 `api/apiClient.ts` 의 도메인 객체
          (`authAPI`, `productAPI`, `orderAPI`, `paymentAPI`, `chatAPI`)를 거칩니다.
        - `.then()` 체이닝 대신 `async`/`await` 를 씁니다.
        - 색상·간격·타이포는 `styles/colors.ts`, `styles/typography.ts` 토큰을 씁니다.
          `#333`, `padding: 13` 같은 매직 값은 지적해주세요.
        - 한 화면이 여러 스텝으로 나뉘면 도메인 폴더 아래 하위 폴더로 묶습니다(예: `screens/auth/signup-steps/`).

    - path: 'components/**'
      instructions: >-
        - 여기에는 여러 화면이 함께 쓰는 컴포넌트만 둡니다. 특정 화면 전용이면 그 화면 옆에 둡니다.
        - 정적 스타일은 파일 하단 `StyleSheet.create` 로 모으고, 런타임에 정해지는 값만 배열로 합성합니다.
        - 누를 수 있는 요소에는 `accessibilityRole` 과 `accessibilityLabel` 이 있어야 합니다.
          아이콘만 있는 버튼은 `accessibilityLabel` 이 특히 필수이고, 터치 영역이 44x44 보다 작으면 `hitSlop` 을 씁니다.
        - 새 컴포넌트가 기존 `Common*`(예: `CommonInput`, `CommonPopup`, `CommonDropdown`)이나
          바텀시트 컴포넌트와 겹치지 않는지 봐주세요.

    - path: 'api/apiClient.ts'
      instructions: >-
        - axios 인스턴스와 인터셉터 구조(토큰 자동 주입, 401 시 refresh 토큰 큐잉·재시도,
          refresh 엔드포인트 401 시 로그아웃)는 팀 논의 없이 바꾸지 않기로 했습니다.
          공통 로직을 손대는 변경이면 PR 본문에 이유가 있는지 확인해주세요.
        - 엔드포인트 함수 추가는 도메인 객체에 같은 패턴으로 합니다. 새 도메인이면 새 객체를 만듭니다.
        - 인증 요청은 인터셉터 없는 `authClient` 를, 그 외는 `apiClient` 를 씁니다. 이 구분을 유지해주세요.

    - path: 'hooks/**'
      instructions: >-
        - 훅은 `use` 로 시작하고 리소스·기능 단위로 만듭니다.
        - 구독·타이머·소켓(STOMP/SockJS)은 반드시 정리(cleanup)합니다.
          `useChatSocket` 처럼 `deactivate`/`unsubscribe` 가 누락되지 않았는지 봐주세요.
        - 렌더링 JSX 는 훅에 두지 않습니다.

    - path: 'contexts/**'
      instructions: >-
        - 전역 클라이언트 상태만 둡니다. 서버 응답을 컨텍스트에 복사해 두면 소스가 두 벌이 되므로 지적해주세요.
        - Provider 는 `RootNavigator` 트리 상단에 위치해야 합니다.

    - path: 'utils/**'
      instructions: >-
        - 부수효과 없는 순수 함수를 우선합니다. RN 컴포넌트·네비게이션에 의존하는 코드는 여기 두지 않습니다.
        - 폼 검증·데이터 변환·업로드 등 새 로직에는 `__tests__/` 에 단위 테스트를 함께 추가하도록 알려주세요.

    - path: '__tests__/**'
      instructions: >-
        - 스펙 파일은 `*.test.ts` / `*.test.tsx` 입니다.
        - React 19 렌더는 `react-test-renderer` 의 `act(async () => …)` 로 감쌉니다(`LoginScreen.test.tsx` 패턴).
        - 네이티브 모듈·SVG·`react-native-config` 는 스펙 상단 또는 `jest.setup.js` 에서 목 처리합니다.
        - `.skip` 으로 비활성화된 채 방치된 테스트는 지적해주세요.

    - path: 'navigation/**'
      instructions: >-
        - 모든 라우트명과 파라미터 타입은 `RootStackParamList` 에 정의합니다.
          화면에서 `route.params` 를 타입 없이 쓰거나 파라미터 타입을 화면 파일에 따로 만들면 지적해주세요.

    - path: '{package.json,tsconfig.json,.eslintrc.js,.prettierrc.js,babel.config.js,metro.config.js,jest.config.js,jest.setup.js,react-native.config.js,app.json,Gemfile}'
      instructions: >-
        설정 파일 변경은 팀 합의가 필요합니다.
        의존성 추가·변경·삭제, TypeScript strict 완화, ESLint 규칙 비활성화가 있으면 PR 본문에 이유가 적혀 있는지 확인해주세요.
        네이티브 링크가 필요한 패키지를 추가했다면 `jest.setup.js` 에 목이 추가됐는지도 봐주세요.

    - path: '{android/app/src/**,ios/kitschatch/**,android/app/build.gradle,android/build.gradle}'
      instructions: >-
        네이티브 설정입니다. 패키지명·번들 ID, 권한(AndroidManifest, Info.plist),
        서명·빌드 설정 변경은 의도가 PR 본문에 설명돼 있는지 확인해주세요.
        키스토어 비밀번호나 API 키가 코드로 커밋되지 않았는지도 봐주세요.

  finishing_touches:
    # 주석 컨벤션이 한국어 설명문이라 자동 docstring 은 끕니다.
    docstrings:
      enabled: false
    # Jest 가 구성돼 있고 utils 로직에 단위 테스트를 붙이는 규칙이므로 켭니다.
    unit_tests:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: 'off'
    title:
      mode: warning
      requirements: >-
        PR 제목은 Conventional Commits 형식 `타입(스코프): 한국어 설명` 이어야 합니다.
        타입은 feat, fix, refactor, test, style, chore, docs 중 하나이고 스코프는 선택입니다.
        예) `feat(auth): 네이버 소셜 로그인 연동`, `test: jest 인프라 정비`
    description:
      mode: warning
    issue_assessment:
      mode: warning

  tools:
    eslint:
      enabled: true
    # CI(test / lint / typecheck) 결과를 리뷰에 함께 반영합니다.
    github-checks:
      enabled: true
      timeout_ms: 180000
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    semgrep:
      enabled: true
    # 한국어 문서·주석에서 오탐이 많아 끕니다.
    languagetool:
      enabled: false

chat:
  auto_reply: true
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - CLAUDE.md
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
